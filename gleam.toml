name = "google_youtube_api_v3"
version = "1.0.1"
description = "Gleam bindings for the YouTube Data API v3, generated from the official discovery document"
licences = ["Apache-2.0"]
repository = { type = "github", user = "dericsso", repo = "google_api_gleam" }
links = [{ title = "Homepage", href = "https://github.com/dericsso/google_api_gleam" }]

# For a full reference of all the available options, you can have a look at
# https://gleam.run/writing-gleam/gleam-toml/.

[dependencies]
gleam_stdlib = ">= 1.0.0 and < 2.0.0"
gleam_json = ">= 3.1.0 and < 4.0.0"
gleam_http = ">= 4.5.0 and < 5.0.0"

[dev_dependencies]
gleeunit = ">= 1.0.0 and < 2.0.0"
simplifile = ">= 2.7.0 and < 3.0.0"
justin = ">= 1.1.0 and < 2.0.0"
gleamgen = ">= 1.0.4 and < 2.0.0"
